# Render Blueprint for the TheThirdEye server. Render builds the Dockerfile
# above from the repo root, so no registry push is needed.
#
# After first deploy: set PROVIDER=meta + META_API_KEY in the dashboard for
# live vision (PROVIDER=mock works with no key), copy the generated
# APP_TOKEN into the judges' APK (EXPO_PUBLIC_APP_TOKEN) and the app's
# server URL to wss://<this-service>.onrender.com.
#
# Note: /data is ephemeral on the free tier, so enrolled faces reset on
# redeploy. Attach a Render disk at /data for a persistent people store.
services:
  - type: web
    name: thethirdeye-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PROVIDER
        value: mock
      - key: AGENT_MODEL
        value: muse-spark-1.3
      - key: META_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_TOKEN
        generateValue: true
      - key: FACES
        value: stub
